<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Qask Multi-Agent Bridge MVP</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self';">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="control-panel" data-collapsed="false">
      <button id="sidebarToggle" class="collapse-toggle" aria-label="Collapse sidebar" aria-expanded="true">
        <svg class="collapse-icon" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
          <path d="M11.67 3.87L9.9 2.1 0 12l9.9 9.9 1.77-1.77L3.54 12z"/>
          <path d="M22.24 3.87L20.47 2.1 10.57 12l9.9 9.9 1.77-1.77L14.11 12z"/>
        </svg>
      </button>
      <div class="control-body">
        <!-- Collapse sidebar工具（仅在折叠时显示） -->
        <div class="collapsed-toolbar">
          <!-- 日期时间显示 -->
          <div class="datetime-display">
            <div class="date-text" id="collapsedDate">--</div>
            <div class="time-text" id="collapsedTime">--:--</div>
          </div>

          <!-- Layout按钮（纵向） -->
          <div class="collapsed-layout-buttons">
            <button class="collapsed-layout-btn" data-layout="single" data-tooltip="Single Panel" title="Single-panel layout" aria-label="Single-panel layout" aria-pressed="false">
              <span class="layout-glyph layout-glyph--single"></span>
            </button>
            <button class="collapsed-layout-btn" data-layout="dual" data-tooltip="Two-panel layout" title="Two-panel layout" aria-label="Two-panel layout" aria-pressed="false">
              <span class="layout-glyph layout-glyph--dual"></span>
            </button>
            <button class="collapsed-layout-btn" data-layout="triple" data-tooltip="Three-panel layout" title="Three-panel layout" aria-label="Three-panel layout" aria-pressed="false">
              <span class="layout-glyph layout-glyph--triple"></span>
            </button>
            <button class="collapsed-layout-btn" data-layout="quad" data-tooltip="Four-panel layout" title="Four-panel layout" aria-label="Four-panel layout" aria-pressed="false">
              <span class="layout-glyph layout-glyph--quad"></span>
            </button>
          </div>

          <!-- Screenshot按钮 -->
          <button class="collapsed-action-btn" id="screenshotBtn" data-tooltip="Screenshot" title="Capture current conversation">
            <span>📸</span>
          </button>
        </div>
        <section class="panel-section">
          <header><h2>Layout</h2></header>
          <div class="layout-grid" id="layoutControls" aria-label="Panel layout">
            <button type="button" class="layout-button" data-layout="single" aria-label="Single-panel layout" aria-pressed="false" title="Single-panel layout">
              <span class="layout-glyph layout-glyph--single"></span>
            </button>
            <button type="button" class="layout-button" data-layout="dual" aria-label="Two-panel layout" aria-pressed="false" title="Two-panel layout">
              <span class="layout-glyph layout-glyph--dual"></span>
            </button>
            <button type="button" class="layout-button" data-layout="triple" aria-label="Three-panel layout" aria-pressed="false" title="Three-panel layout">
              <span class="layout-glyph layout-glyph--triple"></span>
            </button>
            <button type="button" class="layout-button" data-layout="quad" aria-label="Four-panel layout" aria-pressed="false" title="Four-panel layout">
              <span class="layout-glyph layout-glyph--quad"></span>
            </button>
          </div>
        </section>
        <!-- 网页模型管理 -->
        <section class="panel-section" id="webModeSection">
          <header><h2>AI Websites</h2></header>
          <div id="webModeContent" class="mode-content">
            <div class="model-stack">
              <ul id="modelList" class="model-list" aria-label="AI website order"></ul>
              <p id="modelOrderStatus" class="model-order-status" role="status" aria-live="polite"></p>
              <button id="modelAddButton" class="model-add-button" type="button" aria-label="Add Website" title="Add a new AI website">
                <span>+ Add Website</span>
              </button>
            </div>
          </div>
        </section>
      </div>
    </aside>
    <div class="main-column">
      <main class="workspace">
        <div id="panelsContainer" class="panels-container" data-layout="dual"></div>
      </main>
      <footer class="composer">
        <form id="broadcastForm" class="composer-form">
          <div class="composer-input">
            <button id="addAttachment" type="button" class="input-action-btn add-btn" aria-label="Add attachment" title="Add image, audio, or PDF attachment">
              <span class="add-icon">+</span>
            </button>
            <textarea id="broadcastInput" rows="1" spellcheck="true" autofocus aria-label="Send a message to the active websites" placeholder="Ask the active websites"></textarea>
            <div class="input-right-actions">
              <button id="recordAudioButton" type="button" class="input-action-btn record-btn" aria-label="Record audio attachment" title="Record audio attachment">
                <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true">
                  <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
                  <path d="M19 11a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V22H8v2h8v-2h-3v-2.06A9 9 0 0 0 21 11h-2Z"/>
                </svg>
              </button>
              <button id="stopRecordingButton" type="button" class="input-action-btn stop-recording-btn" aria-label="Stop recording并Add attachment" title="Stop recording" hidden>
                <span aria-hidden="true">■</span>
              </button>
              <button id="cancelRecordingButton" type="button" class="input-action-btn cancel-recording-btn" aria-label="Cancel recording" title="Cancel recording" hidden>
                <span aria-hidden="true">×</span>
              </button>
              <button id="sendButton" type="submit" class="input-action-btn send-btn" aria-label="Send message" title="Send message (Enter)" disabled>
                <svg class="send-icon" viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true">
                  <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
                </svg>
              </button>
            </div>
            <input id="attachmentInput" type="file" hidden multiple accept="image/png,image/jpeg,image/gif,image/webp,audio/*,application/pdf,.pdf,.webm,.ogg,.mp3,.wav,.m4a,.aac,.flac">
          </div>
          <ul id="attachmentPreview" class="attachment-preview" aria-label="Attachments to send" aria-live="polite"></ul>
        </form>
      </footer>
    </div>
  </div>
  <div id="modelAddDialog" class="model-add-dialog" role="dialog" aria-modal="true" aria-labelledby="modelAddDialogTitle" hidden>
    <div class="model-add-backdrop" data-dismiss></div>
    <div class="model-add-panel">
      <h3 id="modelAddDialogTitle">Add Website</h3>
      <form id="modelAddForm" class="model-add-form">
        <label class="model-add-field">
          <span>Website name</span>
          <input id="modelAddName" name="label" type="text" autocomplete="off" required placeholder="Example: Poe" maxlength="32">
        </label>
        <label class="model-add-field">
          <span>Website URL</span>
          <input id="modelAddUrl" name="url" type="url" required placeholder="https://example.com/">
        </label>
        <p class="model-add-hint">Enter a complete HTTPS URL. Custom websites fill the message by default but do not send automatically.</p>
        <label class="model-add-autosend">
          <input id="modelAddAutoSend" name="allowAutoSend" type="checkbox">
          <span>I trust this website and allow Qask to send text automatically</span>
        </label>
        <div class="model-add-actions">
          <button type="button" id="modelAddCancel" class="model-add-cancel">Cancel</button>
          <button type="submit" class="model-add-confirm">Add</button>
        </div>
      </form>
    </div>
  </div>


  <script type="module" src="./renderer.js"></script>
</body>
</html>
